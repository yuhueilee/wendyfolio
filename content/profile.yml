    Adaptable software engineer with 4 years of experience across the full
    stack. A quick learner and dependable team player, driven to build tools
    and systems that help teams move faster.
  about: >-
    Hi, I'm Wendy - a software engineer with four years of experience. My
    journey has taken me from backend to frontend: building subscription
    features for a food delivery app while conducting e2e tests covering key
    user flows, modernizing an e-commerce platform's React Native app with
    TypeScript and CI/CD workflows, and now working at the intersection of
    React and AI tooling - building AI agents that speed up package migrations
    and automate repetitive engineering work. What ties it all together? I
    love stepping outside my comfort zone and building tools that help teams
    move faster.
